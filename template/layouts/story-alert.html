<!DOCTYPE html>
<!-- STORY WOW: alert — schermata d'allarme: triangolo di pericolo luminoso, testo "glitch",
     strisce di emergenza. Per cybersecurity/NIS2. Modifica: etichetta, domanda (una parola in <span>), pillola. -->
<html><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<style>
:root{ --bg:#0A0306; --ink:#FFFFFF; --dim:#C9A3AC; --a1:#FF2E4D; --a2:#FFD60A; --line:#2A0B12; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative}
.glow{position:absolute;left:50%;top:640px;width:1100px;height:1100px;margin-left:-550px;border-radius:50%;background:radial-gradient(circle,rgba(255,46,77,.35),transparent 62%)}
.stripe{position:absolute;left:0;right:0;height:64px;background:repeating-linear-gradient(-45deg,var(--a2) 0 40px,#111 40px 80px)}
.lab{position:absolute;top:290px;left:0;right:0;text-align:center;font:bold 30px 'DejaVu Sans Mono',monospace;letter-spacing:10px;color:var(--a1)}
svg.tri{position:absolute;left:290px;top:370px}
.q{position:absolute;top:900px;left:60px;right:60px;text-align:center;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:104px;line-height:1;letter-spacing:-4px;
  text-shadow:-5px 0 rgba(0,255,255,.55),5px 0 rgba(255,46,77,.7)}
.q span{color:var(--a2);text-shadow:none}
.pill{position:absolute;left:0;right:0;bottom:400px;text-align:center}
.pill span{display:inline-block;border:3px solid var(--a2);color:var(--a2);font-weight:800;font-size:40px;padding:20px 40px;border-radius:60px;background:rgba(255,214,10,.08)}
</style></head><body>
<div class="glow"></div>
<div class="stripe" style="top:150px"></div><div class="stripe" style="bottom:250px"></div>
<div class="lab">⚠ INCIDENTE IN CORSO</div>
<svg class="tri" width="500" height="460" viewBox="0 0 500 460">
  <defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path d="M250,30 L470,420 L30,420 Z" fill="none" stroke="var(--a1)" stroke-width="22" stroke-linejoin="round" filter="url(#g)"/>
  <rect x="232" y="150" width="36" height="150" rx="18" fill="var(--ink)"/><circle cx="250" cy="355" r="22" fill="var(--ink)"/>
</svg>
<div class="q">Hai <span>24 ore</span>.<br>Sai chi chiamare?</div>
<div class="pill"><span>Nel post di oggi ↓</span></div>
</body></html>
