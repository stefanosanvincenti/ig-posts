<!DOCTYPE html>
<!-- STORY: stat — un numero enorme preso dal post, anelli disegnati, una riga di contesto. Solo numeri verificati.
     Modifica: numero, unità, contesto, fonte breve. -->
<html><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<style>
:root{ --bg:#FFD23F; --ink:#121212; --dim:#3D3A2E; --a1:#121212; --a2:#6B2BFF; --line:rgba(0,0,0,.15); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative}
svg.rings{position:absolute;left:-200px;top:300px}
.kicker{position:absolute;top:270px;left:80px;font:bold 28px 'DejaVu Sans Mono',monospace;letter-spacing:6px}
.num{position:absolute;top:520px;left:60px;right:40px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:380px;line-height:.9;letter-spacing:-18px}
.unit{position:absolute;top:900px;left:80px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:110px;letter-spacing:-4px;color:var(--a2)}
.ctx{position:absolute;top:1090px;left:80px;right:90px;font-size:50px;font-weight:700;line-height:1.2;letter-spacing:-1px}
.src{position:absolute;top:1380px;left:80px;right:80px;font-size:28px;color:var(--dim)}
.cta{position:absolute;left:80px;right:80px;bottom:330px;display:flex;align-items:center;gap:22px;font-weight:800;font-size:42px}
.cta i{display:block;width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--bg);font:900 50px/84px 'Inter',sans-serif;text-align:center;font-style:normal}
</style></head><body>
<svg class="rings" width="1400" height="1400"><g fill="none" stroke="var(--ink)" stroke-width="3" opacity=".12"><circle cx="700" cy="700" r="300"/><circle cx="700" cy="700" r="450"/><circle cx="700" cy="700" r="600"/></g></svg>
<div class="kicker">NIS2 · IL NUMERO</div>
<div class="num">10</div>
<div class="unit">milioni di euro</div>
<div class="ctx">La sanzione massima per un soggetto essenziale che ignora la NIS2.</div>
<div class="src">O il 2% del fatturato mondiale, se più alto. Fonte: Dir. (UE) 2022/2555</div>
<div class="cta"><i>↓</i>Cosa fare, nel post di oggi</div>
</body></html>
