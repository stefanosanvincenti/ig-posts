<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<style>
:root{ --bg:#062C30; --ink:#FFFFFF; --dim:#A3C9C7; --a1:#FF8A5B; --a2:#7CF2E2; --line:#0F4549; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative;
  background-image:radial-gradient(circle,var(--line) 3px,transparent 3.5px);background-size:44px 44px}
.hook{position:absolute;top:290px;left:80px;right:80px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:100px;line-height:1.02;letter-spacing:-3.5px}
.hook span{color:var(--a1)}
.big{position:absolute;top:760px;left:80px;font-weight:900;font-size:300px;letter-spacing:-12px;line-height:1;color:var(--a2)}
.t{position:absolute;top:1070px;left:80px;right:80px;font-size:50px;font-weight:700;line-height:1.2}
.cart{position:absolute;left:80px;top:1300px;font-size:120px}
.sub{position:absolute;left:80px;right:80px;bottom:330px;font-size:42px;font-weight:700;color:var(--a1)}
</style></head><body>
<div class="hook">Il tuo carrello <span>si svuota</span> prima del pagamento?</div>
<div class="big">7/10</div>
<div class="t">carrelli online abbandonati prima dell'acquisto (Baymard, 50 studi)</div>
<div class="sub">Guarda il post: 5 cause da controllare →</div>
</body></html>
