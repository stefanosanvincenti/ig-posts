<!DOCTYPE html>
<!-- LAYOUT: poster — manifesto tipografico: una frase forte in grande + illustrazione geometrica.
     Adatto a: opinioni, provocazioni, un solo concetto (niente elenchi). Ottimo per variare il feed.
     Modifica: kicker, le righe della frase (una parola in <mark>), la riga di spiegazione. -->
<html><head><meta charset="utf-8"><meta name="size" content="1080x1350">
<style>
:root{ --bg:#FF5A4F; --ink:#1A0B0A; --dim:#4A1D1A; --a1:#FFFFFF; --a2:#1A0B0A; --line:rgba(0,0,0,.18); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative}
.kicker{position:absolute;top:70px;left:72px;font-family:'DejaVu Sans Mono',monospace;font-weight:bold;font-size:24px;letter-spacing:5px}
svg{position:absolute;right:-80px;top:-60px}
.say{position:absolute;left:66px;right:60px;top:430px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:118px;line-height:.98;letter-spacing:-5px}
.say mark{background:var(--a1);color:var(--ink);padding:0 14px;border-radius:12px}
.why{position:absolute;left:72px;right:200px;top:1020px;font-size:34px;line-height:1.3;font-weight:600;border-left:8px solid var(--ink);padding-left:26px}
.foot{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;font-family:'DejaVu Sans Mono',monospace;font-size:22px;color:var(--dim)}
.foot b{color:var(--ink)}
</style></head><body>
<div class="kicker">CYBERSECURITY · PUNTO FERMO</div>
<svg width="520" height="520" viewBox="0 0 520 520">
  <g fill="none" stroke="var(--ink)" stroke-width="4" opacity=".9">
    <circle cx="260" cy="260" r="90"/><circle cx="260" cy="260" r="150" stroke-dasharray="6 14"/><circle cx="260" cy="260" r="210" opacity=".5"/></g>
  <rect x="215" y="245" width="90" height="70" rx="12" fill="var(--a1)"/>
  <path d="M232,245 v-24 a28,28 0 0 1 56,0 v24" fill="none" stroke="var(--a1)" stroke-width="12"/>
  <circle cx="260" cy="280" r="9" fill="var(--ink)"/>
</svg>
<div class="say">Una password<br>non è un<br><mark>piano di</mark><br><mark>sicurezza.</mark></div>
<div class="why">L'autenticazione a più fattori ferma la gran parte degli accessi con credenziali rubate. Attivala prima di tutto il resto.</div>
<div class="foot"><span>Salva per dopo</span><b>@stefano_sanvincenti_seo</b></div>
</body></html>
