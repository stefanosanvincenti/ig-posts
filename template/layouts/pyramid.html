<!DOCTYPE html>
<!-- LAYOUT: pyramid — piramide a 4 livelli disegnata in SVG, con note a lato.
     Adatto a: gerarchie, fondamenta prima del resto, livelli di difesa, maturità.
     Modifica: testi nei 4 livelli (dal vertice alla base) e note laterali. Il livello in cima è evidenziato. -->
<html><head><meta charset="utf-8"><meta name="size" content="1080x1350">
<style>
:root{ --bg:#0C0818; --ink:#FFFFFF; --dim:#B9B3CC; --a1:#A855F7; --a2:#39E5FF; --line:#241C3A; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative}
.kicker{position:absolute;top:70px;left:72px;font-family:'DejaVu Sans Mono',monospace;font-weight:bold;font-size:24px;letter-spacing:5px;color:var(--a2)}
h1{position:absolute;top:118px;left:72px;right:72px;font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:78px;line-height:1.03;letter-spacing:-2px}
h1 span{color:var(--a1)}
svg{position:absolute;left:0;top:0}
.lv{position:absolute;text-align:center;font-weight:800;line-height:1.1}
.note{position:absolute;font-size:22px;color:var(--dim);line-height:1.3;width:230px}
.note b{display:block;font:bold 20px 'DejaVu Sans Mono',monospace;letter-spacing:3px;color:var(--a2);margin-bottom:6px}
.foot{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;font-family:'DejaVu Sans Mono',monospace;font-size:22px;color:var(--dim)}
.foot b{color:var(--a2)}
</style></head><body>
<div class="kicker">SEO FOR AI · LE FONDAMENTA</div>
<h1>Le citazioni AI<br><span>stanno in cima</span></h1>
<!-- piramide: centro x=430, vertice y=380, base y=1180, 4 livelli da 200px -->
<svg width="1080" height="1350">
  <polygon points="430,380 530,580 330,580" fill="var(--a1)"/>
  <polygon points="325,590 535,590 635,790 225,790" fill="var(--a1)" opacity=".55"/>
  <polygon points="220,800 640,800 740,1000 120,1000" fill="var(--a1)" opacity=".32"/>
  <polygon points="115,1010 745,1010 835,1190 25,1190" fill="var(--a1)" opacity=".18"/>
  <g stroke="var(--a2)" stroke-width="2" stroke-dasharray="6 6">
    <path d="M520,500 L790,500"/><path d="M600,700 L790,700"/><path d="M700,900 L790,900"/><path d="M790,1100 L790,1100"/>
  </g>
</svg>
<div class="lv" style="left:330px;top:500px;width:200px;font-size:26px">Citazioni</div>
<div class="lv" style="left:280px;top:668px;width:300px;font-size:28px">Autorevolezza</div>
<div class="lv" style="left:180px;top:878px;width:500px;font-size:30px">Contenuti originali</div>
<div class="lv" style="left:80px;top:1082px;width:700px;font-size:32px">Sito tecnicamente sano</div>
<div class="note" style="left:800px;top:470px"><b>RISULTATO</b>Arriva solo se il resto regge</div>
<div class="note" style="left:800px;top:670px"><b>FIDUCIA</b>Autore, brand, menzioni</div>
<div class="note" style="left:800px;top:870px"><b>VALORE</b>Esperienza e dati tuoi</div>
<div class="note" style="left:850px;top:1065px;width:200px"><b>BASE</b>Indicizzabile e veloce</div>
<div class="foot"><span>Salva per dopo</span><b>@stefano_sanvincenti_seo</b></div>
</body></html>
