<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<style>
:root{ --bg:#0B1220; --ink:#FFFFFF; --dim:#A9B6CC; --a1:#C6F432; --a2:#FF5A4F; --line:#22314F; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative;
  background-image:radial-gradient(circle,var(--line) 3px,transparent 3.5px);background-size:44px 44px}
.hook{position:absolute;top:290px;left:80px;right:80px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:104px;line-height:1;letter-spacing:-4px}
.hook span{color:var(--a1)}
.frame{position:absolute;left:210px;top:680px;width:640px;transform:rotate(-3deg)}
.frame img{width:100%;display:block;border-radius:18px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.tape{position:absolute;width:200px;height:58px;background:rgba(255,240,200,.75)}
.t1{left:-50px;top:30px;transform:rotate(-38deg)}.t2{right:-50px;top:30px;transform:rotate(38deg)}
.badge{position:absolute;right:70px;top:620px;width:210px;height:210px;border-radius:50%;background:var(--a1);color:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:44px;line-height:1;letter-spacing:-1px;transform:rotate(12deg);box-shadow:0 0 0 10px var(--bg)}
.sub{position:absolute;left:80px;right:80px;bottom:340px;font-size:42px;font-weight:700;color:var(--a1)}
</style></head><body>
<div class="hook">La tua scheda prodotto <span>parla</span> anche a Google?</div>
<div class="frame"><img src="{{POST_IMG}}"><div class="tape t1"></div><div class="tape t2"></div></div>
<div class="badge">5 DATI<br>da avere</div>
<div class="sub">Tutto nel post di oggi, salvalo →</div>
</body></html>
