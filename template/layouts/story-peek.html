<!DOCTYPE html>
<!-- STORY: peek — frase gancio + anteprima del post "attaccata" con lo scotch + bollino "NUOVO" ruotato.
     Modifica: gancio (una parola in <span>), testo sotto. {{POST_IMG}} viene riempito da render.py --img. -->
<html><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<style>
:root{ --bg:#062C30; --ink:#FFFFFF; --dim:#A3C9C7; --a1:#FF8A5B; --a2:#7CF2E2; --line:#0F4549; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative;
  background-image:radial-gradient(circle,var(--line) 3px,transparent 3.5px);background-size:44px 44px}
.hook{position:absolute;top:270px;left:80px;right:80px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:96px;line-height:1.02;letter-spacing:-3.5px}
.hook span{color:var(--a1)}
.frame{position:absolute;left:220px;top:600px;width:660px;transform:rotate(3deg)}
.frame img{width:100%;display:block;border-radius:18px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.tape{position:absolute;width:200px;height:58px;background:rgba(255,240,200,.75)}
.t1{left:-50px;top:30px;transform:rotate(-38deg)}.t2{right:-50px;top:30px;transform:rotate(38deg)}
.badge{position:absolute;left:70px;top:520px;width:220px;height:220px;border-radius:50%;background:var(--a1);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:50px;letter-spacing:-1px;transform:rotate(-14deg);box-shadow:0 0 0 10px var(--bg)}
.sub{position:absolute;left:80px;right:80px;bottom:330px;font-size:42px;font-weight:700;color:var(--a2)}
</style></head><body>
<div class="hook">4 passaggi tra il tuo sito e <span>una risposta AI</span></div>
<div class="frame"><img src="{{POST_IMG}}"><div class="tape t1"></div><div class="tape t2"></div></div>
<div class="badge">NUOVO</div>
<div class="sub">Tocca il profilo e salvalo →</div>
</body></html>
