<!DOCTYPE html>
<!-- STORY WOW: statement — frase manifesto con una parola barrata e sostituita (es. costo → investimento),
     tre "ritorni" con icona, CTA. Per messaggi di posizionamento forti. -->
<html><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<style>
:root{ --bg:#0B1426; --ink:#FFFFFF; --dim:#A9B7D0; --a1:#1F5BFF; --a2:#3DF5A8; --bad:#FF3D57; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Inter','DejaVu Sans',sans-serif;position:relative}
.gl{position:absolute;left:-200px;top:300px;width:1400px;height:1200px;background:radial-gradient(ellipse,rgba(31,91,255,.28),transparent 62%)}
.k{position:absolute;top:270px;left:80px;font:bold 28px 'DejaVu Sans Mono',monospace;letter-spacing:6px;color:var(--a2)}
.t{position:absolute;top:340px;left:76px;right:70px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:118px;line-height:1.0;letter-spacing:-5px}
.t s{color:var(--dim);text-decoration-color:var(--bad);text-decoration-thickness:8px}
.t span{color:var(--a2);text-shadow:0 0 40px rgba(61,245,168,.45)}
.r{position:absolute;left:80px;right:80px;top:1010px}
.r div{display:flex;align-items:center;gap:26px;margin-bottom:34px;font-size:42px;font-weight:800;line-height:1.15}
.r div i{flex:none;width:84px;height:84px;border-radius:24px;background:rgba(61,245,168,.12);border:3px solid var(--a2);display:flex;align-items:center;justify-content:center;font-style:normal}
.cta{position:absolute;left:80px;top:1500px;padding:24px 44px;border-radius:50px;background:#fff;color:#0B1426;font-weight:900;font-size:40px;white-space:nowrap}
</style></head><body>
<div class="gl"></div>
<div class="k">CYBERSICUREZZA · NIS2</div>
<div class="t">Non è<br>un <s>costo</s>.<br>È un <span>investimento.</span></div>
<div class="r">
  <div><i><svg width="44" height="44" viewBox="0 0 44 44"><path d="M6,30 L16,20 L24,28 L38,12" fill="none" stroke="#3DF5A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28,12 H38 V22" fill="none" stroke="#3DF5A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></i>L'azienda non si ferma</div>
  <div><i><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="15" cy="16" r="7" fill="none" stroke="#3DF5A8" stroke-width="4"/><circle cx="31" cy="18" r="6" fill="none" stroke="#3DF5A8" stroke-width="4"/><path d="M3,38 C4,28 26,28 27,38 M26,31 C29,26 42,26 42,36" fill="none" stroke="#3DF5A8" stroke-width="4"/></svg></i>I clienti ti scelgono</div>
  <div><i><svg width="40" height="44" viewBox="0 0 40 44"><path d="M20,3 L36,9 V21 C36,31 29,38 20,41 C11,38 4,31 4,21 V9 Z" fill="none" stroke="#3DF5A8" stroke-width="4"/><path d="M12,22 L18,28 L28,16" stroke="#3DF5A8" stroke-width="4" fill="none" stroke-linecap="round"/></svg></i>Niente sanzioni NIS2</div>
</div>
<div class="cta">Cosa ti ripaga, nel post ↓</div>
</body></html>
